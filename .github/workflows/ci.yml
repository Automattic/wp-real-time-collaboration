name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck, Jest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gutenberg/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      # Jest and typecheck resolve the editor packages and their types
      # from the bundled Gutenberg, which is committed source-only.
      # --ignore-scripts skips its husky prepare hook (it errors outside
      # a git root); the lifecycle outputs it also skips are regenerated
      # by `npm run build`.
      - name: Install and build the vendored Gutenberg subtree
        run: |
          cd gutenberg
          npm ci --ignore-scripts
          npm run build

      # PHP lint (composer lint) runs in the php job, where Composer is
      # already installed. The debt was burned down to zero (V1 item A6);
      # the lint step keeps it there.
      - name: Lint
        run: npm run lint:js

      # The prose against the code: paths, option and filter names,
      # links and anchors, the docs index, retired names, and the
      # numbers marked as constants (tests/tools/doc-lint.mjs).
      - name: Doc-lint
        run: npm run lint:docs

      - name: Typecheck
        run: npm run typecheck

      - name: Jest
        run: npm run test:js

      # The engine core exists twice, in JavaScript and in PHP, and JSON
      # vector files keep the two equal. Run the generators again and
      # fail if a stored copy differs from fresh output.
      - name: Test vectors match the generators
        run: npm run test:vectors

      # The simulator sweep: many seeded sessions through the engine
      # core, with every check on. No WordPress needed.
      - name: Simulator sweep
        run: npm run test:sweep

      # Two parts of the bundled Gutenberg that the plugin leans on:
      # the revision comparison the review dialogs use, and the record of
      # block operations the engine takes its edits from. Run Gutenberg's
      # own tests for both, so a change made in `gutenberg/` (listed under
      # `local_changes` in gutenberg-pin.json) stays covered.
      - name: Bundled Gutenberg tests (revision comparison, block operations)
        run: |
          cd gutenberg
          npm run test:unit -- post-revisions-preview block-operations

      - name: Build the plugin bundle
        run: npm run build

  php:
    name: PHPUnit (wp-env)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # PHPUnit needs the Gutenberg build too: an unbuilt gutenberg.php
      # skips its lib/, which holds the collaboration on/off switch, so
      # every collaboration test would find collaboration off.
      - name: Set up dependencies and the Gutenberg build
        uses: ./.github/actions/setup

      # phpcs runs on the runner's PHP directly (no WordPress).
      - name: Set up PHP for phpcs
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-progress

      # Zero errors, zero warnings since the A6 burn-down; this step keeps
      # the standards debt from silently re-accumulating.
      - name: PHP lint (phpcs)
        run: composer lint

      # Tests target the dedicated tests environment (.wp-env.tests.json)
      # — the default .wp-env.json is the dev environment, whose afterStart
      # hook (the websocket daemon) has no business in CI.
      - name: Start wp-env (tests)
        run: npm run env:tests start

      - name: PHPUnit
        run: npm run test:php

  bench:
    name: Benchmark invariants (certify sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up dependencies and the Gutenberg build
        uses: ./.github/actions/setup

      - name: Build the plugin bundle
        run: npm run build

      - name: Start wp-env (tests)
        run: npm run env:tests start

      - name: Certify sweep
        run: npm run bench -- --certify=3

  # One job per engine, run side by side. Each engine's specs carry an
  # `@engine-<slug>` tag; RTC_E2E_ENGINE picks one slice (see
  # tests/e2e/playwright.config.ts). The `none` slice runs the specs that
  # belong to no engine, so the two slices together are the whole suite.
  e2e:
    name: End-to-end (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One engine failing must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - engine: intent-log
            label: intent-log
          - engine: none
            label: engine-neutral
    steps:
      - uses: actions/checkout@v4

      - name: Set up dependencies and the Gutenberg build
        uses: ./.github/actions/setup
        with:
          playwright: 'true'

      - name: Build the plugin bundle
        run: npm run build

      - name: Start wp-env (tests)
        run: npm run env:tests start

      # The @wordpress/scripts base config applies 2 retries under CI,
      # which absorbs the suite's known under-load flake (a fixture login
      # navigation can time out in a full run; every spec is green solo —
      # see AGENTS.md).
      - name: Playwright
        env:
          RTC_E2E_ENGINE: ${{ matrix.engine }}
        run: npm run test:e2e

      # cancelled() covers timed-out runs, where we also want artifacts
      - name: Upload test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.label }}-artifacts
          path: artifacts/
          retention-days: 7

  e2e-websocket:
    name: End-to-end websocket (real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up dependencies and the Gutenberg build
        uses: ./.github/actions/setup
        with:
          playwright: 'true'

      - name: Build the plugin bundle
        run: npm run build

      - name: Start wp-env (tests)
        run: npm run env:tests start

      # The websocket-only suite runs against the plugin's REAL websocket
      # transport: the launcher publishes the `wp collaboration
      # sync-server` daemon from the tests env's cli image on host port
      # 8787 and restores the site's transport at teardown (V1 item A3 —
      # this lane is what de-experimentalizes the websocket transport).
      - name: Playwright (websocket-only)
        run: npm run test:e2e:websocket

      - name: Upload test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-websocket-artifacts
          path: artifacts/
          retention-days: 7
